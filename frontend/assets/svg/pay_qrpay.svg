<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" width="80" height="50">
  <!-- QR background grid motif -->
  <g opacity="0.3" fill="#D32F2F">
    <rect x="18" y="6" width="8" height="8" rx="2" />
    <rect x="54" y="6" width="8" height="8" rx="2" />
    <rect x="18" y="34" width="8" height="8" rx="2" />
    <rect x="54" y="34" width="8" height="8" rx="2" />
    <line x1="28" y1="10" x2="52" y2="10" stroke="#D32F2F" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="28" y1="38" x2="52" y2="38" stroke="#D32F2F" stroke-width="2" stroke-dasharray="3,3" />
  </g>
  <!-- Paytm text logo -->
  <g transform="translate(15, 14)">
    <text x="0" y="20" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="18" fill="#00BAF2">paytm</text>
  </g>
</svg>
